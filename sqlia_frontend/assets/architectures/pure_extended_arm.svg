<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760">
<rect width="800" height="760" fill="#f8fafc"/>
<g font-family="Arial" text-anchor="middle" fill="#173b67">
<text x="400" y="44" font-size="27" font-weight="bold">Pure Extended ARM</text>
<text x="400" y="73" font-size="16">PURE_EXTENDED_ARM | Rules only, no ML classifier</text>
<rect x="50" y="95" width="700" height="98" rx="12" fill="#fff1d6"/>
<text x="400" y="121" font-size="18" font-weight="bold">Setup (not repeated for each input)</text>
<text x="400" y="148" font-size="16">Training: mine itemset, negative-item and sequential rules.</text>
<text x="400" y="175" font-size="16">Validation: calibrate the decision threshold.</text>
<rect x="100" y="224" width="600" height="70" rx="12" fill="#e2eefa"/>
<text x="400" y="252" font-size="19" font-weight="bold">Input</text>
<text x="400" y="278" font-size="16">SQL, payload or user input</text>
<rect x="100" y="332" width="600" height="78" rx="12" fill="#e2eefa"/>
<text x="400" y="361" font-size="19" font-weight="bold">Extract items and ordered tokens</text>
<text x="400" y="388" font-size="16">Match against the fixed Training rules</text>
<rect x="100" y="448" width="600" height="78" rx="12" fill="#e2eefa"/>
<text x="400" y="477" font-size="19" font-weight="bold">Score = highest matched-rule confidence</text>
<text x="400" y="504" font-size="16">No matched rule: score = 0</text>
<rect x="100" y="564" width="600" height="98" rx="12" fill="#e1f2e8"/>
<text x="400" y="594" font-size="19" font-weight="bold">Compare score with calibrated threshold</text>
<text x="400" y="621" font-size="16">At or above: SQLi / block recommendation</text>
<text x="400" y="646" font-size="16">Below: benign label / review recommendation</text>
<text x="400" y="707" font-size="16">Rules stay fixed. A benign label is not proof of safety.</text>
<text x="400" y="733" font-size="15">Recommendations do not execute or block database queries.</text>
</g>
<g stroke="#173b67" stroke-width="3"><path d="M400 294 V319 M400 410 V435 M400 526 V551"/></g>
<g fill="#173b67"><path d="M393 314 L407 314 L400 325 Z"/><path d="M393 430 L407 430 L400 441 Z"/><path d="M393 546 L407 546 L400 557 Z"/></g>
</svg>
