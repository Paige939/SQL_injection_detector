<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1640" viewBox="0 0 3000 1640" role="img" aria-labelledby="title desc">
  <title id="title">External Generalization Performance</title>
  <desc id="desc">Paired baseline versus NO_NEGATIVE rule-ablation results, seed 20261025. Pure ARM accuracy 61.67 to 92.40%, precision 57.54 to 95.74%, recall 98.91 to 89.27%, F1-score 72.76 to 92.40%. Hybrid accuracy 61.03 to 87.73%, precision 57.12 to 84.03%, recall 98.98 to 94.19%, F1-score 72.44 to 88.82%. Source: rule-ablation-20261025-1427/ablation-report.json, externalDevelopmentDiagnostics. Baseline values reproduce the original frozen evaluation. NO_NEGATIVE filters rules with negative items before classifier fitting without refilling the rule set. Thresholds are selected on Validation separately for each candidate, never on external data. Same external development dataset, not independent blind evidence. Source independence unverified; no candidate deployed. Bars use full-precision metrics; labels round to two decimals.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#203047;font-size:35pt}
    .title,.heading{font-size:40pt;font-weight:700}
    .note{font-size:27pt;fill:#485a70}
    .grid{stroke:#dfe5ec;stroke-width:2}
    .axis{stroke:#485a70;stroke-width:3;fill:none}
    .baseline{fill:#8c98aa}.removed{fill:#0072b2}
  </style>
  <rect width="3000" height="1640" fill="white"/>
