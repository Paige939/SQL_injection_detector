<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2280" viewBox="0 0 2800 2280" role="img" aria-labelledby="title desc">
  <title id="title">Approach: Pure and Hybrid Extended Association Rule Mining</title>
  <desc id="desc">Training-only extended rule learning feeds Pure and Hybrid detection. Pure uses maximum matched confidence. Hybrid combines six statistical features and rule features with an incremental classifier. Optional verified-label updates change the classifier, not the rules. Body text is Arial 35 pt; headings and key text are Arial bold 40 pt at the SVG's native size.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9Z" fill="#46566a"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;font-size:35pt;fill:#203047}
      .title,.heading,.label,.stage{font-size:40pt;font-weight:700}
      .small,.stage{fill:#485a70}
      .box{fill:#fff;stroke:#b6c4d4;stroke-width:3;rx:24}
      .shared{fill:#eef4fc;stroke:#678bb5;stroke-width:3;rx:24}
      .pure{fill:#edf7f3;stroke:#458571;stroke-width:3;rx:24}
      .hybrid{fill:#f1effb;stroke:#8270b1;stroke-width:3;rx:24}
      .flow{fill:none;stroke:#46566a;stroke-width:4;marker-end:url(#arrow)}
      .connector{fill:none;stroke:#46566a;stroke-width:4}
      .optional{fill:none;stroke:#8270b1;stroke-width:4;stroke-dasharray:12 10;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="2800" height="2280" fill="#fff"/>
  <text class="title" x="1400" y="90" text-anchor="middle">Extended Association Rule Mining (Extended ARM)</text>
  <text x="1400" y="152" text-anchor="middle">Pure and Hybrid SQL injection detection</text>

  <text class="stage" x="90" y="230">1  RULE LEARNING — TRAINING DATA ONLY</text>
  <rect class="shared" x="90" y="270" width="2620" height="150"/>
  <text class="label" x="1400" y="332" text-anchor="middle">Labeled training data</text>
  <text x="1400" y="390" text-anchor="middle">Preprocessing → six statistical features + SQL-related tokens</text>
  <path class="connector" d="M1400 420 V452"/>
  <path class="flow" d="M1400 452 H740 V490"/>
  <path class="flow" d="M1400 452 H2080 V490"/>

  <rect class="shared" x="90" y="490" width="1300" height="300"/>
  <text class="label" x="740" y="552" text-anchor="middle">Itemset rules</text>
  <text x="740" y="612" text-anchor="middle">Statistical feature items + SQL-related tokens</text>
  <text x="740" y="670" text-anchor="middle">+ negative items (absent features / tokens)</text>
  <text class="label" x="740" y="746" text-anchor="middle">FP-Growth → association rule generation</text>

  <rect class="shared" x="1450" y="490" width="1260" height="300"/>
  <text class="label" x="2080" y="552" text-anchor="middle">Sequential rules</text>
  <text x="2080" y="612" text-anchor="middle">Ordered SQL-related tokens</text>
  <text x="2080" y="670" text-anchor="middle">Preserve order; allow gaps</text>
  <text class="label" x="2080" y="746" text-anchor="middle">PrefixSpan → sequential attack rules</text>

  <path class="connector" d="M740 790 V832 H2080 V790"/>
  <path class="flow" d="M1400 832 V870"/>
  <rect class="shared" x="390" y="870" width="2020" height="150"/>
  <text class="label" x="1400" y="932" text-anchor="middle">Select a fixed set of extended rules</text>
  <text x="1400" y="990" text-anchor="middle">Support, confidence, lift + coverage of additional attack samples</text>

  <text class="stage" x="90" y="1096">2  DETECTION — SHARED FIXED RULES</text>
  <rect class="box" x="790" y="1130" width="1220" height="150"/>
  <text class="label" x="1400" y="1192" text-anchor="middle">Input preprocessing and rule matching</text>
  <text x="1400" y="1250" text-anchor="middle">Apply the learned rules to new inputs.</text>
  <path class="flow" d="M1400 1020 V1130"/>
  <path class="connector" d="M1400 1280 V1310"/>
  <path class="flow" d="M1400 1310 H720 V1350"/>
  <path class="flow" d="M1400 1310 H2080 V1350"/>

  <rect class="pure" x="90" y="1350" width="1260" height="740"/>
  <text class="heading" x="720" y="1418" text-anchor="middle">Pure Extended ARM</text>
  <rect class="box" x="170" y="1450" width="1100" height="156"/>
  <text class="label" x="720" y="1514" text-anchor="middle">Highest matched-rule confidence</text>
  <text x="720" y="1574" text-anchor="middle">No match → score 0</text>
  <path class="flow" d="M720 1606 V1660"/>
  <rect class="box" x="170" y="1660" width="1100" height="140"/>
  <text class="label" x="720" y="1722" text-anchor="middle">Score → threshold → prediction</text>
  <text x="720" y="1780" text-anchor="middle">Attack / Benign</text>
  <text x="720" y="1900" text-anchor="middle">Rule-based detection</text>
  <text x="720" y="1962" text-anchor="middle">No incremental learning</text>
  <text class="small" x="720" y="2024" text-anchor="middle">No match does not guarantee safety.</text>

  <rect class="hybrid" x="1450" y="1350" width="1260" height="740"/>
  <text class="heading" x="2080" y="1418" text-anchor="middle">Hybrid Extended ARM</text>
  <rect class="box" x="1530" y="1450" width="1100" height="156"/>
  <text class="label" x="2080" y="1514" text-anchor="middle">Six statistical features + rule features</text>
  <text x="2080" y="1574" text-anchor="middle">Per rule: matched confidence or 0</text>
  <path class="flow" d="M2080 1606 V1646"/>
  <rect class="box" x="1530" y="1646" width="1100" height="190"/>
  <text class="label" x="2080" y="1708" text-anchor="middle">Incremental classifier</text>
  <text x="2080" y="1766" text-anchor="middle">Trained with combined features</text>
  <text class="small" x="2080" y="1820" text-anchor="middle">Online Bagging + Naive Bayes (default)</text>
  <path class="flow" d="M2080 1836 V1876"/>
  <rect class="box" x="1530" y="1876" width="1100" height="126"/>
  <text x="2080" y="1932" text-anchor="middle">Score → threshold → prediction</text>
  <text class="label" x="2080" y="1990" text-anchor="middle">Attack / Benign</text>
  <text class="small" x="2080" y="2064" text-anchor="middle">Optional: verified label → classifier update</text>
  <path class="optional" d="M2640 2050 H2672 V1740 H2630"/>

  <text class="small" x="90" y="2160">Alternative classifiers, tested separately: Stochastic Gradient Descent (SGD) / Hoeffding Tree</text>
  <text class="small" x="90" y="2224">Rules stay fixed. Research thresholds use Validation only, not external data.</text>
</svg>
