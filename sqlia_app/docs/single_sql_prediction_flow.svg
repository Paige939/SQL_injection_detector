<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img" aria-labelledby="title desc">
  <title id="title">使用者輸入單筆 SQL 的三架構預測流程</title>
  <desc id="desc">輸入 SQL 通過基本驗證後，分別交給正常行為 Profile、基礎特徵增量式機器學習及 Extended 混合架構預測。新輸入只做預測，不自動更新模型或重新探勘 FP-Growth。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#52616b"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;fill:#20303a}
      .title{font-size:34px;font-weight:700}.subtitle{font-size:17px;fill:#50616b}
      .lane{fill:#f6f8f8;stroke:#d9e1e2;stroke-width:2;rx:18}
      .head{rx:12}.headtext{font-size:21px;font-weight:700;fill:#fff}
      .box{fill:#fff;stroke:#ccd7d9;stroke-width:2;rx:12}
      .boxtext{font-size:18px;font-weight:600}.small{font-size:15px;fill:#52616b}
      .link{fill:none;stroke:#52616b;stroke-width:2.5;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#52616b;stroke-width:2.5}
      .note{fill:#fff6df;stroke:#e5c66c;stroke-width:2;rx:12}
      .noteText{font-size:17px;font-weight:600;fill:#5e4a18}
      .invalid{fill:#fff1ef;stroke:#dd9b91;stroke-width:2;rx:12}
      .validText{font-size:15px;font-weight:700;fill:#52616b}
    </style>
  </defs>
  <rect width="1600" height="1510" fill="#fbfcfa"/>
  <text class="title" x="70" y="62">單筆 SQL 輸入：三種架構各自預測</text>
  <text class="subtitle" x="70" y="98">同一筆查詢由 API 逐架構呼叫三條獨立路徑；輸入本身不會觸發線上學習或重新探勘規則。</text>

  <rect class="box" x="580" y="132" width="440" height="72"/>
  <text class="boxtext" x="800" y="176" text-anchor="middle">使用者輸入 SQL 查詢</text>
  <path class="link" d="M800 204 V245"/>
  <path d="M800 245 L1005 310 L800 375 L595 310 Z" fill="#eef3f3" stroke="#aebdc0" stroke-width="2"/>
  <text class="boxtext" x="800" y="305" text-anchor="middle">輸入有效？</text>
  <text class="small" x="800" y="329" text-anchor="middle">非空且未超過長度限制</text>
  <path class="link" d="M595 310 H390 V408"/>
  <text class="validText" x="430" y="296">否</text>
  <rect class="invalid" x="155" y="408" width="470" height="58"/>
  <text class="boxtext" x="390" y="445" text-anchor="middle">回傳輸入錯誤，不進行預測</text>
  <path class="branch" d="M800 375 V448 H300 V488 M800 448 V488 M800 448 H1300 V488"/>
  <text class="validText" x="815" y="405">是</text>
  <path class="link" d="M300 465 V488"/><path class="link" d="M800 465 V488"/><path class="link" d="M1300 465 V488"/>

  <rect class="lane" x="45" y="500" width="510" height="775"/>
  <rect class="lane" x="545" y="500" width="510" height="775"/>
  <rect class="lane" x="1045" y="500" width="510" height="775"/>
  <rect class="head" x="65" y="520" width="470" height="62" fill="#347a72"/>
  <text class="headtext" x="300" y="559" text-anchor="middle">Anomaly-based Normal Profile</text>
  <rect class="head" x="565" y="520" width="470" height="62" fill="#426f91"/>
  <text class="headtext" x="800" y="547" text-anchor="middle">Feature Extraction</text>
  <text class="headtext" x="800" y="571" text-anchor="middle">+ Incremental ML</text>
  <rect class="head" x="1065" y="520" width="470" height="62" fill="#b66d35"/>
  <text class="headtext" x="1300" y="559" text-anchor="middle">Extended 混合架構</text>

  <rect class="box" x="85" y="610" width="430" height="82"/><text class="boxtext" x="300" y="644" text-anchor="middle">擷取六項 SQL 基礎特徵</text><text class="small" x="300" y="670" text-anchor="middle">長度、符號、比較、複雜度、函數、空白／控制字元</text>
  <path class="link" d="M300 692 V714"/>
  <rect class="box" x="85" y="714" width="430" height="76"/><text class="boxtext" x="300" y="760" text-anchor="middle">離散化為特徵項目</text>
  <path class="link" d="M300 790 V812"/>
  <rect class="box" x="85" y="812" width="430" height="84"/><text class="boxtext" x="300" y="847" text-anchor="middle">與已建立的良性行為 Profile 比較</text><text class="small" x="300" y="874" text-anchor="middle">Profile 保存良性特徵項目的累計出現情形</text>
  <path class="link" d="M300 896 V918"/>
  <rect class="box" x="85" y="918" width="430" height="76"/><text class="boxtext" x="300" y="964" text-anchor="middle">計算異常分數</text>
  <path class="link" d="M300 994 V1016"/>
  <rect class="box" x="85" y="1016" width="430" height="84"/><text class="boxtext" x="300" y="1051" text-anchor="middle">依 0.5 門檻判斷</text><text class="small" x="300" y="1078" text-anchor="middle">達門檻：SQL Injection；未達：良性</text>
  <path class="link" d="M300 1100 V1122"/>
  <rect x="85" y="1122" width="430" height="78" fill="#e8f3f0" stroke="#8ab7ad" stroke-width="2" rx="12"/><text class="boxtext" x="300" y="1169" text-anchor="middle">輸出預測類別與異常信心值</text>

  <rect class="box" x="585" y="610" width="430" height="82"/><text class="boxtext" x="800" y="644" text-anchor="middle">擷取六項 SQL 基礎特徵</text><text class="small" x="800" y="670" text-anchor="middle">保留連續數值作為模型輸入</text>
  <path class="link" d="M800 692 V714"/>
  <rect class="box" x="585" y="714" width="430" height="84"/><text class="boxtext" x="800" y="749" text-anchor="middle">輸入已 warmup 的分類器</text><text class="small" x="800" y="776" text-anchor="middle">Naive Bayes + Online Bagging</text>
  <path class="link" d="M800 798 V820"/>
  <rect class="box" x="585" y="820" width="430" height="84"/><text class="boxtext" x="800" y="855" text-anchor="middle">依六項基礎特徵進行分類</text><text class="small" x="800" y="882" text-anchor="middle">此路徑不加入 Profile 或 FP-Growth 特徵</text>
  <path class="link" d="M800 904 V926"/>
  <rect x="585" y="926" width="430" height="78" fill="#eaf1f7" stroke="#8faec4" stroke-width="2" rx="12"/><text class="boxtext" x="800" y="973" text-anchor="middle">輸出預測類別與模型信心值</text>

  <rect class="box" x="1085" y="610" width="430" height="76"/><text class="boxtext" x="1300" y="656" text-anchor="middle">擷取六項 SQL 基礎特徵</text>
  <path class="link" d="M1300 686 V704"/>
  <rect class="box" x="1085" y="704" width="430" height="84"/><text class="boxtext" x="1300" y="739" text-anchor="middle">離散化後比對啟動時的 FP-Growth 規則</text><text class="small" x="1300" y="766" text-anchor="middle">輸入查詢只套用規則，不重新探勘</text>
  <path class="link" d="M1300 788 V806"/>
  <rect class="box" x="1085" y="806" width="430" height="76"/><text class="boxtext" x="1300" y="839" text-anchor="middle">建立規則特徵</text><text class="small" x="1300" y="864" text-anchor="middle">符合前件：放入規則信賴度；否則為 0</text>
  <path class="link" d="M1300 882 V900"/>
  <rect class="box" x="1085" y="900" width="430" height="76"/><text class="boxtext" x="1300" y="946" text-anchor="middle">計算三項正常 Profile 特徵</text>
  <path class="link" d="M1300 976 V994"/>
  <rect class="box" x="1085" y="994" width="430" height="84"/><text class="boxtext" x="1300" y="1029" text-anchor="middle">合併三類特徵並交給分類器</text><text class="small" x="1300" y="1056" text-anchor="middle">基礎特徵 + Profile 特徵 + 規則特徵</text>
  <path class="link" d="M1300 1078 V1096"/>
  <rect x="1085" y="1096" width="430" height="78" fill="#fbefe5" stroke="#d6a77f" stroke-width="2" rx="12"/><text class="boxtext" x="1300" y="1143" text-anchor="middle">Online Bagging 輸出預測與信心值</text>

  <path class="branch" d="M300 1200 V1245 H800 M800 1004 V1245 M1300 1174 V1245 H800"/>
  <path class="link" d="M800 1245 V1300"/>
  <rect x="475" y="1300" width="650" height="70" fill="#e9f0ee" stroke="#9bb8b1" stroke-width="2" rx="14"/>
  <text class="boxtext" x="800" y="1343" text-anchor="middle">畫面彙整並顯示三種架構的預測結果</text>
  <rect class="note" x="205" y="1400" width="1190" height="72"/>
  <text class="noteText" x="800" y="1430" text-anchor="middle">本次單筆預測不會自動更新分類器或正常 Profile；FP-Growth 規則也不會因新輸入而重探勘。</text>
  <text class="small" x="800" y="1455" text-anchor="middle">只有另外提交具標籤／驗證回饋時，增量分類器才會更新；確認良性的資料才會加入 Profile。</text>
</svg>