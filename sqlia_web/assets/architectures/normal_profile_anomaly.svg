<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1320" viewBox="0 0 900 1320">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#123f76"/><stop offset="1" stop-color="#2869a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".16"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#173b67"/></marker></defs>
<rect width="900" height="1320" fill="#f7fbff"/>
<rect x="12" y="12" width="876" height="104" rx="18" fill="url(#head)"/>
<text x="450" y="55" text-anchor="middle" fill="white" font-family="Arial" font-size="32" font-weight="700">Normal Profile-based</text><text x="450" y="91" text-anchor="middle" fill="white" font-family="Arial" font-size="28" font-weight="700">Anomaly Detection</text>
<g font-family="Arial" fill="#15365d"><rect x="115" y="150" width="670" height="142" rx="16" fill="#e6f2ff" stroke="#1472c4" stroke-width="3" filter="url(#shadow)"/><text x="145" y="190" font-size="24" font-weight="700">1. SQL Input &amp; Feature Extraction</text><text x="150" y="229" font-size="18">• Historical benign SQL from SQLite</text><text x="150" y="257" font-size="18">• New SQL query from API request</text><text x="150" y="285" font-size="18">• URL decoding, validation and six base features</text>
<path d="M450 294 V330" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="70" y="345" width="760" height="250" rx="18" fill="#edf9ef" stroke="#24964a" stroke-width="3" filter="url(#shadow)"/><text x="105" y="390" font-size="25" font-weight="700" fill="#176936">2. Incremental Normal Behavior Profile</text><rect x="105" y="415" width="325" height="142" rx="12" fill="#fff" stroke="#53a866" stroke-width="2"/><text x="130" y="449" font-size="20" font-weight="700">Trusted benign data</text><text x="130" y="482" font-size="17">• Extract base features</text><text x="130" y="509" font-size="17">• Convert to transaction items</text><text x="130" y="536" font-size="17">• Update only after verification</text><rect x="470" y="415" width="325" height="142" rx="12" fill="#fff" stroke="#53a866" stroke-width="2"/><text x="495" y="449" font-size="20" font-weight="700">Profile statistics</text><text x="495" y="482" font-size="17">• Count item occurrences</text><text x="495" y="509" font-size="17">• Calculate normal support</text><text x="495" y="536" font-size="17">• Maintain benign transactions</text>
<path d="M450 597 V635" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="115" y="650" width="670" height="190" rx="16" fill="#f2ebff" stroke="#6941bd" stroke-width="3" filter="url(#shadow)"/><text x="145" y="692" font-size="24" font-weight="700" fill="#4a2994">3. Anomaly Feature Generation</text><text x="150" y="730" font-size="18">• Rule-match indicator</text><text x="150" y="760" font-size="18">• Violation ratio</text><text x="150" y="790" font-size="18">• Average normal support and anomaly score</text><text x="150" y="820" font-size="17" fill="#4a2994">No FP-Growth is executed during this online decision.</text>
<path d="M450 842 V880" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="115" y="895" width="670" height="145" rx="16" fill="#e6f2ff" stroke="#1472c4" stroke-width="3" filter="url(#shadow)"/><text x="145" y="937" font-size="24" font-weight="700">4. Anomaly Decision</text><text x="150" y="975" font-size="18">• Compare the SQL with the normal profile</text><text x="150" y="1005" font-size="18">• anomaly score ≥ 0.5 → malicious; otherwise benign</text>
<path d="M450 1042 V1080" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="70" y="1095" width="360" height="145" rx="16" fill="#e9f8e8" stroke="#2f9e44" stroke-width="3"/><text x="250" y="1137" text-anchor="middle" font-size="22" font-weight="700" fill="#176936">Benign</text><text x="100" y="1175" font-size="17">• Return detection result</text><text x="100" y="1205" font-size="17">• Verified benign may update profile</text><rect x="470" y="1095" width="360" height="145" rx="16" fill="#fff0f0" stroke="#d9363e" stroke-width="3"/><text x="650" y="1137" text-anchor="middle" font-size="22" font-weight="700" fill="#a51d2d">Malicious / Suspicious</text><text x="500" y="1175" font-size="17">• Return detection result</text><text x="500" y="1205" font-size="17">• Do not add to normal profile</text></g>
</svg>