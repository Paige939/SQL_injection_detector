<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1280" viewBox="0 0 900 1280">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#123f76"/><stop offset="1" stop-color="#2869a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".16"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#173b67"/></marker></defs>
<rect width="900" height="1280" fill="#f7fbff"/><rect x="12" y="12" width="876" height="104" rx="18" fill="url(#head)"/><text x="450" y="55" text-anchor="middle" fill="white" font-family="Arial" font-size="31" font-weight="700">Feature Extraction +</text><text x="450" y="91" text-anchor="middle" fill="white" font-family="Arial" font-size="28" font-weight="700">Incremental Machine Learning</text>
<g font-family="Arial" fill="#15365d"><rect x="100" y="150" width="700" height="155" rx="16" fill="#e6f2ff" stroke="#1472c4" stroke-width="3" filter="url(#shadow)"/><text x="135" y="192" font-size="24" font-weight="700">1. SQL Input &amp; Feature Extraction</text><text x="140" y="232" font-size="18">• New SQL query from API request</text><text x="140" y="260" font-size="18">• URL decoding and validation</text><text x="140" y="288" font-size="18">• Extract six base SQL features</text><path d="M450 307 V345" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="65" y="360" width="770" height="245" rx="18" fill="#edf9ef" stroke="#24964a" stroke-width="3" filter="url(#shadow)"/><text x="105" y="405" font-size="25" font-weight="700" fill="#176936">2. Base Feature Vector</text><text x="110" y="447" font-size="18">• Payload length</text><text x="110" y="478" font-size="18">• Symbol density</text><text x="110" y="509" font-size="18">• Comparison density</text><text x="475" y="447" font-size="18">• SQL complexity</text><text x="475" y="478" font-size="18">• Function-call density</text><text x="475" y="509" font-size="18">• Discontinuous-character density</text><text x="110" y="560" font-size="17" fill="#176936">The same feature format is used for warmup, prediction and updates.</text><path d="M450 607 V645" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="85" y="660" width="730" height="210" rx="18" fill="#fff0f3" stroke="#e83e63" stroke-width="3" filter="url(#shadow)"/><text x="125" y="705" font-size="25" font-weight="700" fill="#a51d45">3. Incremental Machine Learning</text><rect x="120" y="730" width="295" height="105" rx="12" fill="#fff" stroke="#e83e63" stroke-width="2"/><text x="145" y="763" font-size="20" font-weight="700">Initial warmup</text><text x="145" y="794" font-size="17">• Labeled benign and SQLi data</text><text x="145" y="820" font-size="17">• Initialize model state</text><rect x="480" y="730" width="295" height="105" rx="12" fill="#fff" stroke="#e83e63" stroke-width="2"/><text x="505" y="763" font-size="20" font-weight="700">Online update</text><text x="505" y="794" font-size="17">• Predict before updating</text><text x="505" y="820" font-size="17">• Update with verified label</text><path d="M415 783 H480" stroke="#e83e63" stroke-width="4" marker-end="url(#arrow)"/><path d="M450 872 V910" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="155" y="925" width="590" height="135" rx="16" fill="#e6f2ff" stroke="#1472c4" stroke-width="3" filter="url(#shadow)"/><text x="450" y="967" text-anchor="middle" font-size="24" font-weight="700">4. Online Classifier</text><text x="450" y="1005" text-anchor="middle" font-size="19">NaiveBayesUpdateable + OnlineBagging</text><text x="450" y="1035" text-anchor="middle" font-size="17">Predict label, confidence and evaluation metrics</text><path d="M450 1062 V1100" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="65" y="1115" width="360" height="120" rx="16" fill="#e9f8e8" stroke="#2f9e44" stroke-width="3"/><text x="245" y="1155" text-anchor="middle" font-size="22" font-weight="700" fill="#176936">Benign prediction</text><text x="95" y="1193" font-size="17">• Return label and confidence</text><rect x="475" y="1115" width="360" height="120" rx="16" fill="#fff0f0" stroke="#d9363e" stroke-width="3"/><text x="655" y="1155" text-anchor="middle" font-size="22" font-weight="700" fill="#a51d2d">SQLi prediction</text><text x="505" y="1193" font-size="17">• Return result and optional alert</text></g>
</svg>