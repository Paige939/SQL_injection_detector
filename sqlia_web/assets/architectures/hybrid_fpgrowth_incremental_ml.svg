<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1450" viewBox="0 0 900 1450">
<defs><linearGradient id="head" x1="0" x2="1"><stop stop-color="#123f76"/><stop offset="1" stop-color="#2869a8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".16"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#173b67"/></marker></defs>
<rect width="900" height="1450" fill="#f7fbff"/><rect x="12" y="12" width="876" height="106" rx="18" fill="url(#head)"/><text x="450" y="55" text-anchor="middle" fill="white" font-family="Arial" font-size="29" font-weight="700">Extended FP-Growth + Normal Profile</text><text x="450" y="91" text-anchor="middle" fill="white" font-family="Arial" font-size="26" font-weight="700">+ Incremental Machine Learning</text>
<g font-family="Arial" fill="#15365d"><rect x="95" y="150" width="710" height="140" rx="16" fill="#e6f2ff" stroke="#1472c4" stroke-width="3" filter="url(#shadow)"/><text x="130" y="190" font-size="24" font-weight="700">1. SQL Data Input &amp; Feature Extraction</text><text x="135" y="228" font-size="18">• CSV / SQLite training data and API SQL request</text><text x="135" y="257" font-size="18">• Six base SQL features and transaction items</text><path d="M450 292 V325" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="55" y="340" width="790" height="275" rx="18" fill="#fff6e3" stroke="#d68a00" stroke-width="3" filter="url(#shadow)"/><text x="95" y="383" font-size="25" font-weight="700" fill="#9b5c00">2. Offline FP-Growth Rule Mining</text><rect x="95" y="410" width="325" height="165" rx="12" fill="#fff" stroke="#d68a00" stroke-width="2"/><text x="120" y="445" font-size="20" font-weight="700">Transaction database</text><text x="120" y="478" font-size="17">• Convert SQL features to items</text><text x="120" y="507" font-size="17">• Generate SPMF transactions</text><text x="120" y="536" font-size="17">• Use training data</text><rect x="480" y="410" width="325" height="165" rx="12" fill="#fff" stroke="#d68a00" stroke-width="2"/><text x="505" y="445" font-size="20" font-weight="700">Patterns and rules</text><text x="505" y="478" font-size="17">• Frequent itemsets</text><text x="505" y="507" font-size="17">• Association rules</text><text x="505" y="536" font-size="17">• MinSup / MinConf scenarios</text><path d="M420 492 H480" stroke="#d68a00" stroke-width="4" marker-end="url(#arrow)"/><path d="M450 617 V650" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="70" y="665" width="760" height="220" rx="18" fill="#edf9ef" stroke="#24964a" stroke-width="3" filter="url(#shadow)"/><text x="110" y="708" font-size="25" font-weight="700" fill="#176936">3. Normal Profile and Extended Features</text><text x="115" y="750" font-size="18">• Normal Profile: benign item statistics, violation ratio, anomaly score</text><text x="115" y="785" font-size="18">• FP-Growth: pattern-match and confidence-based rule features</text><text x="115" y="820" font-size="18">• Combine learned profile signals with mined patterns</text><text x="115" y="857" font-size="17" fill="#176936">FP-Growth is trained offline; online updates maintain model/profile state.</text><path d="M450 887 V920" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="115" y="935" width="670" height="145" rx="16" fill="#f2ebff" stroke="#6941bd" stroke-width="3" filter="url(#shadow)"/><text x="450" y="978" text-anchor="middle" font-size="24" font-weight="700" fill="#4a2994">4. Feature Integration</text><text x="450" y="1017" text-anchor="middle" font-size="18">Base SQL features + Normal Profile features</text><text x="450" y="1047" text-anchor="middle" font-size="18">+ FP-Growth pattern/rule features</text><path d="M450 1082 V1115" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="145" y="1130" width="610" height="135" rx="16" fill="#e6f2ff" stroke="#1472c4" stroke-width="3" filter="url(#shadow)"/><text x="450" y="1172" text-anchor="middle" font-size="24" font-weight="700">5. Incremental ML Decision</text><text x="450" y="1210" text-anchor="middle" font-size="19">OnlineBagging + NaiveBayesUpdateable</text><text x="450" y="1240" text-anchor="middle" font-size="17">SQLi / benign prediction and confidence</text><path d="M450 1267 V1300" stroke="#173b67" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="55" y="1315" width="380" height="105" rx="16" fill="#e9f8e8" stroke="#2f9e44" stroke-width="3"/><text x="245" y="1353" text-anchor="middle" font-size="21" font-weight="700" fill="#176936">Verified benign</text><text x="85" y="1388" font-size="16">Update ML + Normal Profile</text><rect x="465" y="1315" width="380" height="105" rx="16" fill="#fff0f0" stroke="#d9363e" stroke-width="3"/><text x="655" y="1353" text-anchor="middle" font-size="21" font-weight="700" fill="#a51d2d">Verified SQLi</text><text x="495" y="1388" font-size="16">Update ML only; do not update profile</text><path d="M55 1370 H25 V720 H65" fill="none" stroke="#176936" stroke-width="4" marker-end="url(#arrow)"/><path d="M845 1370 H875 V1197 H755" fill="none" stroke="#d9363e" stroke-width="4" marker-end="url(#arrow)"/></g>
</svg>